name: macOS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run desktop:mac
      - uses: actions/upload-artifact@v4
        with:
          name: Minds-macOS-installer
          path: |
            release/macos/*.dmg
            release/macos/*.zip
